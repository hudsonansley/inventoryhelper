<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Scan or Enter</title>
    <style>
      :root {
        --ink: #14181d;
        --paper: #eef0f2;
        --line: #c3c9d0;
        --signal: #ff5a1f;
        --signal-dk: #d8410c;
        --sku: #1f6fff;
        --sku-dk: #1454d8;
        --ok: #10b06a;
        --pad: #ffffff;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          "SF Pro Text",
          system-ui,
          sans-serif;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .screen {
        flex: 1;
        display: none;
        flex-direction: column;
        min-height: 0;
      }
      .screen.active {
        display: flex;
      }

      header.bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 2px solid var(--ink);
      }
      header.bar .back {
        border: none;
        background: none;
        font-size: 26px;
        line-height: 1;
        padding: 4px 8px;
        margin: -4px -8px;
        cursor: pointer;
        color: var(--ink);
      }
      header.bar h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      /* ---- Mode select ---- */
      #select {
        justify-content: center;
        padding: 24px 20px;
        gap: 18px;
      }
      #select .lead {
        font-size: 15px;
        color: #556;
        text-align: center;
        margin: 0 0 6px;
      }
      .choice {
        border: 2px solid var(--ink);
        border-radius: 18px;
        background: var(--pad);
        padding: 28px 22px;
        display: flex;
        align-items: center;
        gap: 22px;
        cursor: pointer;
        text-align: left;
        width: 100%;
        transition: transform 0.06s ease;
      }
      .choice:active {
        transform: scale(0.985);
      }
      .choice .glyph {
        flex: 0 0 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .choice .txt b {
        display: block;
        font-size: 21px;
        font-weight: 800;
      }
      .choice .txt span {
        display: block;
        font-size: 13.5px;
        color: #667;
        margin-top: 3px;
      }
      .choice.scan {
        box-shadow: inset 0 0 0 5px rgba(255, 90, 31, 0.12);
      }
      .choice.scan .txt b {
        color: var(--signal-dk);
      }
      .choice.sku {
        box-shadow: inset 0 0 0 5px rgba(31, 111, 255, 0.12);
      }
      .choice.sku .txt b {
        color: var(--sku-dk);
      }

      .bars {
        width: 72px;
        height: 60px;
        display: flex;
        align-items: stretch;
        gap: 3px;
      }
      .bars i {
        background: var(--ink);
        border-radius: 1px;
      }
      .bars i:nth-child(1) {
        flex: 2;
      }
      .bars i:nth-child(2) {
        flex: 1;
      }
      .bars i:nth-child(3) {
        flex: 3;
      }
      .bars i:nth-child(4) {
        flex: 1;
      }
      .bars i:nth-child(5) {
        flex: 1;
      }
      .bars i:nth-child(6) {
        flex: 2;
      }
      .bars i:nth-child(7) {
        flex: 1;
      }
      .bars i:nth-child(8) {
        flex: 3;
      }
      .bars i:nth-child(9) {
        flex: 1;
      }
      .skuglyph {
        font-size: 27px;
        font-weight: 900;
        letter-spacing: 1px;
        border: 3px solid var(--sku-dk);
        color: var(--sku-dk);
        border-radius: 12px;
        padding: 10px 12px;
      }

      /* ---- Scanner ---- */
      #scan {
        position: relative;
        background: #000;
      }
      #scan .stage {
        position: relative;
        flex: 1;
        overflow: hidden;
      }
      #video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .reticle {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        width: 80%;
        max-width: 440px;
        aspect-ratio: 5/3;
        box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.5);
        border-radius: 16px;
      }
      .reticle span {
        position: absolute;
        width: 34px;
        height: 34px;
        border: 4px solid #fff;
      }
      .reticle .tl {
        top: -2px;
        left: -2px;
        border-right: none;
        border-bottom: none;
        border-top-left-radius: 14px;
      }
      .reticle .tr {
        top: -2px;
        right: -2px;
        border-left: none;
        border-bottom: none;
        border-top-right-radius: 14px;
      }
      .reticle .bl {
        bottom: -2px;
        left: -2px;
        border-right: none;
        border-top: none;
        border-bottom-left-radius: 14px;
      }
      .reticle .br {
        bottom: -2px;
        right: -2px;
        border-left: none;
        border-top: none;
        border-bottom-right-radius: 14px;
      }
      .reticle.locked span {
        border-color: var(--ok);
        transition: border-color 0.15s;
      }
      #scan .hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 16px 18px calc(20px + env(safe-area-inset-bottom));
        color: #fff;
        font-size: 14px;
        text-align: center;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
      }
      #scan .status {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .camfail {
        margin: auto;
        max-width: 340px;
        padding: 28px;
        text-align: center;
        color: #fff;
      }
      .camfail p {
        font-size: 15px;
        line-height: 1.55;
      }

      /* ---- SKU pad ---- */
      #sku {
        padding: 18px;
        gap: 16px;
      }
      .display {
        width: 100%;
        -webkit-appearance: none;
        appearance: none;
        border: 2px solid var(--ink);
        border-radius: 14px;
        background: var(--pad);
        color: var(--ink);
        padding: 20px 22px;
        font-family: inherit;
        font-weight: 800;
        letter-spacing: 6px;
        text-align: center;
        height: 88px;
        font-variant-numeric: tabular-nums;
        font-size: var(
          --sku-fs,
          40px
        ); /* set dynamically by JS to keep text fitting */
        outline: none;
        caret-color: var(--sku);
        cursor: text;
      }
      .display:focus {
        border-color: var(--sku);
        box-shadow: inset 0 0 0 2px rgba(31, 111, 255, 0.25);
      }
      .display::placeholder {
        color: #b6bcc3;
        letter-spacing: 2px;
        font-size: 20px;
        font-weight: 600;
      }
      .countnote {
        text-align: center;
        font-size: 13px;
        color: #667;
        margin-top: -8px;
      }
      .countnote.good {
        color: var(--ok);
        font-weight: 700;
      }
      .keys {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        flex: 1;
      }
      .key {
        border: 2px solid var(--line);
        border-radius: 14px;
        background: var(--pad);
        font-size: 28px;
        font-weight: 700;
        cursor: pointer;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 58px;
        transition:
          transform 0.05s ease,
          background 0.1s;
      }
      .key:active {
        transform: scale(0.95);
        background: #e7ebf0;
      }
      .key.util {
        font-size: 18px;
        font-weight: 700;
      }
      .key.enter {
        grid-column: span 3;
        background: var(--sku);
        color: #fff;
        border-color: var(--sku-dk);
        font-size: 20px;
        letter-spacing: 0.5px;
      }
      .key.enter:disabled {
        background: #aeb9cc;
        border-color: #aeb9cc;
        color: #eef;
        cursor: not-allowed;
      }
      .key.enter:active:not(:disabled) {
        background: var(--sku-dk);
      }

      /* ---- Result ---- */
      #result {
        background: var(--paper);
      }
    </style>
  </head>
  <body>
    <section id="select" class="screen active">
      <p class="lead">Choose how to enter the item</p>
      <button class="choice scan" data-go="scan" aria-label="Scan a barcode">
        <span class="glyph"
          ><span class="bars"
            ><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i
            ><i></i></span
        ></span>
        <span class="txt"
          ><b>Scan barcode</b><span>Use the camera to read a UPC</span></span
        >
      </button>
      <button class="choice sku" data-go="sku" aria-label="Enter a SKU number">
        <span class="glyph"><span class="skuglyph">SKU</span></span>
        <span class="txt"
          ><b>Enter SKU</b><span>Type a 5 or 6 digit number</span></span
        >
      </button>
    </section>

    <section id="scan" class="screen">
      <header
        class="bar"
        style="border-color: #333; background: #000; color: #fff"
      >
        <button
          class="back"
          data-go="select"
          style="color: #fff"
          aria-label="Back"
        >
          &lsaquo;
        </button>
        <h1>Scan UPC</h1>
      </header>
      <div class="stage" id="stage">
        <video id="video" playsinline muted autoplay></video>
        <div class="reticle" id="reticle">
          <span class="tl"></span><span class="tr"></span
          ><span class="bl"></span><span class="br"></span>
        </div>
        <div class="status" id="scanStatus">Starting camera&hellip;</div>
        <div class="hint">Hold a UPC-A or UPC-E barcode inside the frame</div>
      </div>
    </section>

    <section id="sku" class="screen">
      <header class="bar">
        <button class="back" data-go="select" aria-label="Back">
          &lsaquo;
        </button>
        <h1>Enter SKU</h1>
      </header>
      <input
        class="display"
        id="skuDisplay"
        inputmode="none"
        autocomplete="off"
        spellcheck="false"
        placeholder="Tap the keys below"
        aria-label="SKU number"
      />
      <div class="countnote" id="skuNote">Enter 5 to 12 digits</div>
      <div class="keys">
        <button class="key" data-d="1">1</button>
        <button class="key" data-d="2">2</button>
        <button class="key" data-d="3">3</button>
        <button class="key" data-d="4">4</button>
        <button class="key" data-d="5">5</button>
        <button class="key" data-d="6">6</button>
        <button class="key" data-d="7">7</button>
        <button class="key" data-d="8">8</button>
        <button class="key" data-d="9">9</button>
        <button class="key util" id="clearKey">Clear</button>
        <button class="key" data-d="0">0</button>
        <button class="key util" id="backKey">&#9003;</button>
        <button class="key enter" id="enterKey" disabled>Enter</button>
      </div>
    </section>

    <script>
      (function () {
        const screens = {
          select: document.getElementById("select"),
          scan: document.getElementById("scan"),
          sku: document.getElementById("sku"),
        };
        function show(name) {
          Object.values(screens).forEach((s) => s.classList.remove("active"));
          screens[name].classList.add("active");
        }
        document.querySelectorAll("[data-go]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const dest = btn.getAttribute("data-go");
            if (dest !== "scan") stopScanner();
            if (dest === "scan") startScanner();
            if (dest === "sku") resetSku();
            show(dest);
          });
        });
        var LOOKUP_BASE =
          "https://merchants.cityhive.net/#!/669a8879e510ce28a1f0f031/inventory?_text=";
        var LOOKUP_TAB = "cityhive_inventory"; // fixed name -> reuses the same tab every time

        function showResult(kind, value) {
          var url = LOOKUP_BASE + encodeURIComponent(value);
          // Reuse the named tab. Because consecutive URLs differ only in the hash
          // fragment, the browser treats it as the same document and won't reload.
          // Blanking the tab first forces a real navigation to the new value.
          var tab = window.open("about:blank", LOOKUP_TAB);
          if (tab) {
            setTimeout(function () {
              try {
                tab.location.href = url;
                tab.focus();
              } catch (e) {}
            }, 50);
          } else {
            // Popup blocked: fall back to a direct open.
            window.open(url, LOOKUP_TAB);
          }
          stopScanner();
          resetSku();
          show("select");
        }

        /* ---------------- Scanner ----------------
     Primary: native BarcodeDetector (built into Chrome).
     Fallback: ZXing UMD, loaded lazily only if BarcodeDetector is missing.
  */
        const video = document.getElementById("video");
        const reticle = document.getElementById("reticle");
        const statusEl = document.getElementById("scanStatus");
        let stream = null;
        let rafId = null;
        let running = false;
        let zxingReader = null;

        const UPC_FORMATS = ["upc_a", "upc_e"];

        async function startScanner() {
          if (running) return;
          running = true;
          lastCandidate = null;
          candidateCount = 0;
          reticle.classList.remove("locked");
          statusEl.textContent = "Starting camera\u2026";

          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return cameraFail(
              "This browser can\u2019t access the camera. Use Chrome over HTTPS.",
            );
          }

          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 },
              },
              audio: false,
            });
          } catch (e) {
            const denied =
              e && (e.name === "NotAllowedError" || e.name === "SecurityError");
            return cameraFail(
              denied
                ? "Camera permission was denied. Click the camera icon in Chrome\u2019s address bar to allow it, then reload."
                : "Couldn\u2019t start the camera. Make sure the page is on HTTPS and no other app is using the camera.",
            );
          }

          video.srcObject = stream;
          try {
            await video.play();
          } catch (_) {}

          if ("BarcodeDetector" in window) {
            try {
              const supported =
                await window.BarcodeDetector.getSupportedFormats();
              const formats = UPC_FORMATS.filter((f) => supported.includes(f));
              if (formats.length) {
                const detector = new window.BarcodeDetector({ formats });
                statusEl.textContent = "Point at a UPC barcode";
                nativeLoop(detector);
                return;
              }
            } catch (_) {
              /* fall through to ZXing */
            }
          }
          startZxing();
        }

        function nativeLoop(detector) {
          const tick = async () => {
            if (!running) return;
            try {
              const codes = await detector.detect(video);
              const hit = codes.find((c) => UPC_FORMATS.includes(c.format));
              if (hit && considerReading(hit.rawValue, hit.format)) return;
            } catch (_) {
              /* transient decode error, keep going */
            }
            rafId = requestAnimationFrame(tick);
          };
          rafId = requestAnimationFrame(tick);
        }

        function startZxing() {
          statusEl.textContent = "Loading scanner\u2026";
          loadZxing(
            () => {
              try {
                const hints = new Map();
                hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS, [
                  ZXingBrowser.BarcodeFormat.UPC_A,
                  ZXingBrowser.BarcodeFormat.UPC_E,
                ]);
                hints.set(ZXingBrowser.DecodeHintType.TRY_HARDER, true);
                zxingReader = new ZXingBrowser.BrowserMultiFormatReader(hints);
                statusEl.textContent = "Point at a UPC barcode";
                zxingReader.decodeFromStream(stream, video, (res) => {
                  if (!running || !res) return;
                  const fmt = res.getBarcodeFormat();
                  const label =
                    fmt === ZXingBrowser.BarcodeFormat.UPC_A
                      ? "upc_a"
                      : fmt === ZXingBrowser.BarcodeFormat.UPC_E
                        ? "upc_e"
                        : null;
                  if (label) considerReading(res.getText(), label);
                });
              } catch (e) {
                cameraFail(
                  "Scanner failed to initialize. Reload the page and try again.",
                );
              }
            },
            () => {
              cameraFail(
                "Couldn\u2019t load the scanning engine (offline?). Your browser also lacks the native scanner. Use SKU entry instead.",
              );
            },
          );
        }

        // Loads ZXing UMD and normalizes it to a stable global: window.ZXingBrowser
        let zxingLoading = false;
        function loadZxing(onReady, onError) {
          if (window.ZXingBrowser) return onReady();
          if (window.ZXing) {
            window.ZXingBrowser = window.ZXing;
            return onReady();
          }
          if (zxingLoading) return;
          zxingLoading = true;
          const s = document.createElement("script");
          s.src =
            "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
          s.onload = () => {
            window.ZXingBrowser = window.ZXingBrowser || window.ZXing;
            if (
              window.ZXingBrowser &&
              window.ZXingBrowser.BrowserMultiFormatReader
            )
              onReady();
            else onError();
          };
          s.onerror = onError;
          document.head.appendChild(s);
        }

        /* --- Light stability check ---
     The native detector is reliable, so we don't second-guess its values with
     checksums (which risk rejecting valid reads, especially UPC-E variants).
     We only require the SAME value on 2 consecutive frames as cheap insurance
     against a rare single-frame glitch. Set REQUIRED_HITS to 1 for instant reads. */
        const REQUIRED_HITS = 2;
        let lastCandidate = null;
        let candidateCount = 0;

        // Returns true when a reading is confirmed and accepted.
        function considerReading(value, format) {
          if (!running) return false;
          if (!value || !/^\d+$/.test(value)) return false; // digits only, no other filtering
          if (value === lastCandidate) {
            candidateCount++;
          } else {
            lastCandidate = value;
            candidateCount = 1;
          }
          if (candidateCount >= REQUIRED_HITS) {
            onDecoded(value);
            return true;
          }
          return false;
        }

        function onDecoded(value) {
          if (!running) return;
          reticle.classList.add("locked");
          stopScanner();
          if (navigator.vibrate) navigator.vibrate(60);
          showResult("Scanned UPC", value);
        }

        function stopScanner() {
          running = false;
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          if (zxingReader) {
            try {
              zxingReader.reset();
            } catch (_) {}
            zxingReader = null;
          }
          if (stream) {
            stream.getTracks().forEach((t) => t.stop());
            stream = null;
          }
          video.srcObject = null;
        }

        function cameraFail(message) {
          stopScanner();
          const stage = document.getElementById("stage");
          stage.innerHTML =
            '<div class="camfail"><p>' +
            message +
            "</p>" +
            '<button class="again" id="failBack" style="background:#fff;color:#000;border-color:#fff;">Go back</button></div>';
          document
            .getElementById("failBack")
            .addEventListener("click", () => location.reload());
        }

        /* ---------------- SKU pad ---------------- */
        const MIN_DIGITS = 5,
          MAX_DIGITS = 12;
        const displayEl = document.getElementById("skuDisplay");
        const noteEl = document.getElementById("skuNote");
        const enterKey = document.getElementById("enterKey");

        // Keep the on-screen pad as the only input source: block the OS keyboard,
        // but still allow the field to hold a caret for insertion-point placement.
        displayEl.addEventListener("focus", () => {
          displayEl.readOnly = false;
        });
        displayEl.addEventListener("beforeinput", (e) => e.preventDefault()); // no typing/paste
        displayEl.addEventListener("keydown", (e) => e.preventDefault());

        // Dynamic font sizing: shrink until the text fits the field's width.
        function fitFont() {
          const max = 40,
            min = 16;
          displayEl.style.setProperty("--sku-fs", max + "px");
          // available inner width (minus horizontal padding)
          const cs = getComputedStyle(displayEl);
          const avail =
            displayEl.clientWidth -
            parseFloat(cs.paddingLeft) -
            parseFloat(cs.paddingRight);
          let size = max;
          // scrollWidth grows with content; step down until it fits or we hit min
          while (size > min && displayEl.scrollWidth > displayEl.clientWidth) {
            size -= 2;
            displayEl.style.setProperty("--sku-fs", size + "px");
          }
        }

        function caret() {
          // returns [start, end] clamped to the current value length
          const v = displayEl.value;
          let s = displayEl.selectionStart,
            e = displayEl.selectionEnd;
          if (s == null) s = v.length;
          if (e == null) e = v.length;
          return [s, e];
        }

        function setCaret(pos) {
          displayEl.setSelectionRange(pos, pos);
        }

        function refresh() {
          const v = displayEl.value;
          const valid = v.length >= MIN_DIGITS && v.length <= MAX_DIGITS;
          enterKey.disabled = !valid;
          if (v.length === 0) noteEl.textContent = "Enter 5 to 12 digits";
          else if (v.length < MIN_DIGITS)
            noteEl.textContent =
              MIN_DIGITS -
              v.length +
              " more digit" +
              (MIN_DIGITS - v.length === 1 ? "" : "s") +
              " needed";
          else
            noteEl.textContent = "\u2713 Ready \u2022 " + v.length + " digits";
          noteEl.className = "countnote" + (valid ? " good" : "");
          fitFont();
        }

        function insertDigit(d) {
          let v = displayEl.value;
          if (v.length >= MAX_DIGITS) return; // cap at 12
          let [s, e] = caret();
          displayEl.value = v.slice(0, s) + d + v.slice(e);
          setCaret(s + 1);
          refresh();
        }

        function backspace() {
          let v = displayEl.value;
          let [s, e] = caret();
          if (s !== e) {
            // delete a selection
            displayEl.value = v.slice(0, s) + v.slice(e);
            setCaret(s);
          } else if (s > 0) {
            // delete char before caret
            displayEl.value = v.slice(0, s - 1) + v.slice(s);
            setCaret(s - 1);
          }
          refresh();
        }

        function resetSku() {
          displayEl.value = "";
          displayEl.blur();
          refresh();
        }

        document.querySelectorAll(".key[data-d]").forEach((k) => {
          // pointerdown so the field doesn't lose focus/caret to the button
          k.addEventListener("pointerdown", (ev) => {
            ev.preventDefault();
            insertDigit(k.getAttribute("data-d"));
          });
        });
        document
          .getElementById("backKey")
          .addEventListener("pointerdown", (ev) => {
            ev.preventDefault();
            backspace();
          });
        document
          .getElementById("clearKey")
          .addEventListener("pointerdown", (ev) => {
            ev.preventDefault();
            resetSku();
          });
        enterKey.addEventListener("click", () => {
          const v = displayEl.value;
          if (v.length >= MIN_DIGITS && v.length <= MAX_DIGITS)
            showResult("Entered SKU", v);
        });
        window.addEventListener("resize", fitFont);
        refresh();
      })();
    </script>
  </body>
</html>
