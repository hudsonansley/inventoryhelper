<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Scan or Enter</title>
    <style>
      :root {
        --ink: #14181d;
        --paper: #eef0f2;
        --line: #c3c9d0;
        --signal: #ff5a1f;
        --signal-dk: #d8410c;
        --sku: #1f6fff;
        --sku-dk: #1454d8;
        --ok: #10b06a;
        --pad: #ffffff;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          -apple-system,
          "SF Pro Text",
          system-ui,
          sans-serif;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .screen {
        flex: 1;
        display: none;
        flex-direction: column;
        min-height: 0;
      }
      .screen.active {
        display: flex;
      }

      header.bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 2px solid var(--ink);
      }
      header.bar .back {
        border: none;
        background: none;
        font-size: 26px;
        line-height: 1;
        padding: 4px 8px;
        margin: -4px -8px;
        cursor: pointer;
        color: var(--ink);
      }
      header.bar h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.2px;
        flex: 1;
      }
      .flipcam {
        border: none;
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex: 0 0 auto;
        padding: 0;
      }
      .flipcam:active {
        transform: scale(0.92);
        background: rgba(255, 255, 255, 0.28);
      }
      .camlabel {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        max-width: 80%;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        z-index: 5;
      }
      .camlabel.show {
        opacity: 1;
      }

      /* ---- Mode select ---- */
      #select {
        justify-content: center;
        padding: 24px 20px;
        gap: 18px;
      }
      #select .lead {
        font-size: 15px;
        color: #556;
        text-align: center;
        margin: 0 0 6px;
      }
      .choice {
        border: 2px solid var(--ink);
        border-radius: 18px;
        background: var(--pad);
        padding: 28px 22px;
        display: flex;
        align-items: center;
        gap: 22px;
        cursor: pointer;
        text-align: left;
        width: 100%;
        transition: transform 0.06s ease;
      }
      .choice:active {
        transform: scale(0.985);
      }
      .choice .glyph {
        flex: 0 0 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .choice .txt b {
        display: block;
        font-size: 21px;
        font-weight: 800;
      }
      .choice .txt span {
        display: block;
        font-size: 13.5px;
        color: #667;
        margin-top: 3px;
      }
      .choice.scan {
        box-shadow: inset 0 0 0 5px rgba(255, 90, 31, 0.12);
      }
      .choice.scan .txt b {
        color: var(--signal-dk);
      }
      .choice.sku {
        box-shadow: inset 0 0 0 5px rgba(31, 111, 255, 0.12);
      }
      .choice.sku .txt b {
        color: var(--sku-dk);
      }

      .choice.search {
        box-shadow: inset 0 0 0 5px rgba(16, 176, 106, 0.12);
      }

      .choice.search .txt b {
        color: var(--ok);
      }

      .bars {
        width: 72px;
        height: 60px;
        display: flex;
        align-items: stretch;
        gap: 3px;
      }
      .bars i {
        background: var(--ink);
        border-radius: 1px;
      }
      .bars i:nth-child(1) {
        flex: 2;
      }
      .bars i:nth-child(2) {
        flex: 1;
      }
      .bars i:nth-child(3) {
        flex: 3;
      }
      .bars i:nth-child(4) {
        flex: 1;
      }
      .bars i:nth-child(5) {
        flex: 1;
      }
      .bars i:nth-child(6) {
        flex: 2;
      }
      .bars i:nth-child(7) {
        flex: 1;
      }
      .bars i:nth-child(8) {
        flex: 3;
      }
      .bars i:nth-child(9) {
        flex: 1;
      }
      .skuglyph {
        font-size: 27px;
        font-weight: 900;
        letter-spacing: 1px;
        border: 3px solid var(--sku-dk);
        color: var(--sku-dk);
        border-radius: 12px;
        padding: 10px 12px;
      }

      /* ---- Scanner ---- */
      #scan {
        position: relative;
        background: #000;
      }
      #scan .stage {
        position: relative;
        flex: 1;
        overflow: hidden;
      }
      #video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .reticle {
        position: absolute;
        left: 50%;
        top: 46%;
        transform: translate(-50%, -50%);
        width: 80%;
        max-width: 440px;
        aspect-ratio: 5/3;
        box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.5);
        border-radius: 16px;
      }
      .reticle span {
        position: absolute;
        width: 34px;
        height: 34px;
        border: 4px solid #fff;
      }
      .reticle .tl {
        top: -2px;
        left: -2px;
        border-right: none;
        border-bottom: none;
        border-top-left-radius: 14px;
      }
      .reticle .tr {
        top: -2px;
        right: -2px;
        border-left: none;
        border-bottom: none;
        border-top-right-radius: 14px;
      }
      .reticle .bl {
        bottom: -2px;
        left: -2px;
        border-right: none;
        border-top: none;
        border-bottom-left-radius: 14px;
      }
      .reticle .br {
        bottom: -2px;
        right: -2px;
        border-left: none;
        border-top: none;
        border-bottom-right-radius: 14px;
      }
      .reticle.locked span {
        border-color: var(--ok);
        transition: border-color 0.15s;
      }
      #scan .hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 16px 18px calc(20px + env(safe-area-inset-bottom));
        color: #fff;
        font-size: 14px;
        text-align: center;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
      }
      #scan .status {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .camfail {
        margin: auto;
        max-width: 340px;
        padding: 28px;
        text-align: center;
        color: #fff;
      }
      .camfail p {
        font-size: 15px;
        line-height: 1.55;
      }

      /* ---- SKU pad ---- */
      #sku {
        padding: 18px;
        gap: 16px;
      }
      .display {
        width: 100%;
        -webkit-appearance: none;
        appearance: none;
        border: 2px solid var(--ink);
        border-radius: 14px;
        background: var(--pad);
        color: var(--ink);
        padding: 20px 22px;
        font-family: inherit;
        font-weight: 800;
        letter-spacing: 6px;
        text-align: center;
        height: 88px;
        font-variant-numeric: tabular-nums;
        font-size: var(
          --sku-fs,
          40px
        ); /* set dynamically by JS to keep text fitting */
        outline: none;
        caret-color: var(--sku);
        cursor: text;
      }
      .display:focus {
        border-color: var(--sku);
        box-shadow: inset 0 0 0 2px rgba(31, 111, 255, 0.25);
      }
      .display::placeholder {
        color: #b6bcc3;
        letter-spacing: 2px;
        font-size: 20px;
        font-weight: 600;
      }
      .countnote {
        text-align: center;
        font-size: 13px;
        color: #667;
        margin-top: -8px;
      }
      .countnote.good {
        color: var(--ok);
        font-weight: 700;
      }
      .keys {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        flex: 1;
      }
      .key {
        border: 2px solid var(--line);
        border-radius: 14px;
        background: var(--pad);
        font-size: 28px;
        font-weight: 700;
        cursor: pointer;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 58px;
        transition:
          transform 0.05s ease,
          background 0.1s;
      }
      .key:active {
        transform: scale(0.95);
        background: #e7ebf0;
      }
      .key.util {
        font-size: 18px;
        font-weight: 700;
      }
      .key.enter {
        grid-column: span 3;
        background: var(--sku);
        color: #fff;
        border-color: var(--sku-dk);
        font-size: 20px;
        letter-spacing: 0.5px;
      }
      .key.enter:disabled {
        background: #aeb9cc;
        border-color: #aeb9cc;
        color: #eef;
        cursor: not-allowed;
      }
      .key.enter:active:not(:disabled) {
        background: var(--sku-dk);
      }

      /* Compact SKU action buttons */
      #sku .keys {
        display: flex;
        flex: 0 0 auto;
        gap: 10px;
        margin-top: 0;
      }
      #sku .keys .key {
        min-height: 46px;
        height: 46px;
        font-size: 16px;
        border-radius: 12px;
      }
      #sku .keys #clearKey {
        flex: 0 0 88px;
      }
      #sku .keys #enterKey {
        flex: 1;
        grid-column: auto;
      }

      /* ---- Result ---- */
      #result {
        background: var(--paper);
      }
      .build {
        text-align: center;
        font-size: 12px;
        color: #99a0a8;
        margin: 10px 0 0;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <section id="select" class="screen active">
      <p class="lead">Choose how to enter the item</p>
      <button class="choice scan" data-go="scan" aria-label="Scan a barcode">
        <span class="glyph"
          ><span class="bars"
            ><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i
            ><i></i></span
        ></span>
        <span class="txt"
          ><b>Scan barcode</b><span>Use the camera to read a UPC</span></span
        >
      </button>
      <button class="choice sku" data-go="sku" aria-label="Enter a SKU number">
        <span class="glyph"><span class="skuglyph">SKU</span></span>
        <span class="txt"
          ><b>Enter SKU</b><span>Type a 5 or 6 digit number</span></span
        >
      </button>
      <button
        class="choice search"
        data-go="search"
        aria-label="Search inventory"
      >
        <span class="glyph"><span class="skuglyph">⌕</span></span>
        <span class="txt"
          ><b>Search</b><span>Search by name or other text</span></span
        >
      </button>
      <p class="build">Build 0021</p>
    </section>

    <section id="scan" class="screen">
      <header
        class="bar"
        style="border-color: #333; background: #000; color: #fff"
      >
        <button
          class="back"
          data-go="select"
          style="color: #fff"
          aria-label="Back"
        >
          &lsaquo;
        </button>
        <h1>Scan UPC</h1>
        <button
          class="flipcam"
          id="flipCam"
          aria-label="Switch camera"
          title="Switch camera"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 8a8 8 0 0 0-14.3-3.3M4 4v4h4" />
            <path d="M4 16a8 8 0 0 0 14.3 3.3M20 20v-4h-4" />
            <circle cx="12" cy="12" r="2.5" />
          </svg>
        </button>
      </header>
      <div class="stage" id="stage">
        <video id="video" playsinline muted autoplay></video>
        <div class="reticle" id="reticle">
          <span class="tl"></span><span class="tr"></span
          ><span class="bl"></span><span class="br"></span>
        </div>
        <div class="status" id="scanStatus">Starting camera&hellip;</div>
        <div class="camlabel" id="camLabel"></div>
        <div class="hint">Hold a UPC-A or UPC-E barcode inside the frame</div>
      </div>
    </section>

    <section id="search" class="screen">
      <header class="bar">
        <button class="back" data-go="select" aria-label="Back">
          &lsaquo;
        </button>
        <h1>Search</h1>
      </header>
      <form
        id="searchForm"
        style="padding: 18px; display: flex; flex-direction: column; gap: 16px"
      >
        <input
          class="display"
          id="searchDisplay"
          type="search"
          inputmode="text"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Search"
          aria-label="Search inventory"
        />
        <button class="key enter" id="searchKey" type="submit">Search</button>
      </form>
    </section>

    <section id="sku" class="screen">
      <header class="bar">
        <button class="back" data-go="select" aria-label="Back">
          &lsaquo;
        </button>
        <h1>Enter SKU</h1>
      </header>
      <input
        class="display"
        id="skuDisplay"
        type="tel"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off"
        spellcheck="false"
        placeholder="Enter SKU"
        aria-label="SKU number"
      />
      <div class="countnote" id="skuNote">Enter 5 to 12 digits</div>
      <div class="keys">
        <button class="key util" id="clearKey" type="button">Clear</button>
        <button class="key enter" id="enterKey" type="button" disabled>
          Enter
        </button>
      </div>
    </section>

    <script>
      (function () {
        const screens = {
          select: document.getElementById("select"),
          scan: document.getElementById("scan"),
          sku: document.getElementById("sku"),
          search: document.getElementById("search"),
        };
        function show(name) {
          Object.values(screens).forEach((s) => s.classList.remove("active"));
          screens[name].classList.add("active");
        }
        document.querySelectorAll("[data-go]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const dest = btn.getAttribute("data-go");
            if (dest !== "scan") stopScanner();
            if (dest === "scan") startScanner();
            if (dest === "sku") resetSku();
            if (dest === "search") resetSearch();
            show(dest);
            if (dest === "sku") setTimeout(() => displayEl.focus(), 100);
            if (dest === "search") setTimeout(() => searchDisplay.focus(), 100);
          });
        });
        var LOOKUP_BASE =
          "https://merchants.cityhive.net/#!/669a8879e510ce28a1f0f031/inventory?_text=";

        function showResult(kind, value) {
          var url = LOOKUP_BASE + encodeURIComponent(value);
          // Navigate THIS tab to the lookup page. Same-tab navigation doesn't require
          // a user-gesture the way window.open() does, so it works reliably after a
          // scan (which completes in an async loop with no tap in the call stack).
          // The browser Back button returns here to scan the next item.
          stopScanner();
          window.location.href = url;
        }

        /* ---------------- Scanner ----------------
     Primary: native BarcodeDetector (built into Chrome).
     Fallback: ZXing UMD, loaded lazily only if BarcodeDetector is missing.
  */
        const video = document.getElementById("video");
        const reticle = document.getElementById("reticle");
        const statusEl = document.getElementById("scanStatus");
        const camLabelEl = document.getElementById("camLabel");

        let stream = null;
        let rafId = null;
        let running = false;
        let zxingReader = null;

        // Camera choice for the OPTIONAL flip button. null = default (rear by hint).
        // This is deliberately kept out of the core start/scan path so it can never
        // block scanning — the thing that actually matters.
        let chosenDeviceId = null;
        let videoDevices = [];

        const UPC_FORMATS = ["upc_a", "upc_e"];

        // Identify the back camera from a device list. On phones the environment
        // camera is usually labeled with "back"/"rear", and when several rear lenses
        // exist the plain one (not wide/ultra/tele/depth) is the right scanner lens.
        function pickBackCamera(cams) {
          if (!cams.length) return null;
          const rear = cams.filter((d) =>
            /back|rear|environment/i.test(d.label),
          );
          if (rear.length) {
            const plain = rear.find(
              (d) => !/wide|ultra|tele|depth|zoom/i.test(d.label),
            );
            return (plain || rear[0]).deviceId;
          }
          // No labels (permission not yet granted) -> can't tell; caller handles it.
          return null;
        }

        // Open a stream. No fixed resolution: a deviceId + exact-resolution combo can
        // throw OverconstrainedError on cameras that can't meet it.
        function openById(deviceId) {
          return navigator.mediaDevices.getUserMedia({
            video: { deviceId: { exact: deviceId } },
            audio: false,
          });
        }

        async function acquireStream() {
          // 1) Explicit user choice from the flip button.
          if (chosenDeviceId) {
            return await openById(chosenDeviceId);
          }
          // 2) Try to select the back camera by enumeration.
          await refreshDeviceList();
          let backId = pickBackCamera(videoDevices);
          if (backId) {
            return await openById(backId);
          }
          // 3) Labels not available yet: open any camera to unlock permission, then
          //    re-enumerate (labels appear post-grant) and switch to the back one.
          const tmp = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false,
          });
          await refreshDeviceList();
          backId = pickBackCamera(videoDevices);
          if (backId) {
            const activeId =
              tmp.getVideoTracks()[0] && tmp.getVideoTracks()[0].getSettings
                ? tmp.getVideoTracks()[0].getSettings().deviceId
                : null;
            if (activeId !== backId) {
              // stop the temp stream and reopen on the back camera
              tmp.getTracks().forEach((t) => t.stop());
              return await openById(backId);
            }
          }
          // Couldn't identify a back camera; use whatever we opened.
          return tmp;
        }

        async function startScanner() {
          if (running) return;
          running = true;
          lastCandidate = null;
          candidateCount = 0;
          reticle.classList.remove("locked");
          statusEl.textContent = "Starting camera\u2026";

          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return cameraFail(
              "This browser can\u2019t access the camera. Use Chrome over HTTPS.",
            );
          }

          // Acquisition strategy, in order of preference:
          //  1. If the flip button chose a specific camera, use exactly that.
          //  2. Otherwise, enumerate cameras and pick the BACK one by label/position,
          //     then open it by deviceId. facingMode is unreliable on this device
          //     (it returns the front camera), so we don't depend on it.
          //  3. If enumeration reveals no labels yet (first run, pre-permission),
          //     do a plain request to unlock permission, then re-run selection.
          // No fixed width/height: exact-resolution constraints can throw
          // OverconstrainedError on cameras that can't hit them, which was killing
          // the back-camera request.
          try {
            stream = await acquireStream();
          } catch (e) {
            const denied =
              e && (e.name === "NotAllowedError" || e.name === "SecurityError");
            return cameraFail(
              denied
                ? "Camera permission was denied. Click the camera icon in Chrome\u2019s address bar to allow it, then reload."
                : "Couldn\u2019t start the camera. Make sure the page is on HTTPS and no other app is using the camera.",
            );
          }

          video.srcObject = stream;
          try {
            await video.play();
          } catch (_) {}
          try {
            await refreshDeviceList();
            showCamLabel();
          } catch (_) {}

          if ("BarcodeDetector" in window) {
            try {
              const supported =
                await window.BarcodeDetector.getSupportedFormats();
              const formats = UPC_FORMATS.filter((f) => supported.includes(f));
              if (formats.length) {
                const detector = new window.BarcodeDetector({ formats });
                statusEl.textContent = "Point at a UPC barcode";
                nativeLoop(detector);
                return;
              }
            } catch (_) {
              /* fall through to ZXing */
            }
          }
          startZxing();
        }

        function nativeLoop(detector) {
          statusEl.textContent = "Point at a UPC barcode";
          const tick = async () => {
            if (!running) return;
            try {
              const codes = await detector.detect(video);
              for (const c of codes) {
                // Filter by the VALUE shape, not the format string (which varies by
                // browser and was silently rejecting valid reads). A UPC is 12 digits
                // (UPC-A) or 8/6 digits (UPC-E). This also naturally ignores 2D codes,
                // whose payloads aren't bare short digit strings.
                if (
                  isUpcShape(c.rawValue) &&
                  considerReading(c.rawValue, c.format)
                )
                  return;
              }
            } catch (_) {
              /* transient decode error, keep going */
            }
            rafId = requestAnimationFrame(tick);
          };
          rafId = requestAnimationFrame(tick);
        }

        // True if the value looks like a UPC/EAN digit string: 6 or 8 (UPC-E),
        // 12 (UPC-A), or 13 (EAN-13, which is how some browsers report UPC-A).
        // Filtering by value shape is browser-independent and still ignores 2D codes,
        // whose payloads aren't bare short digit strings.
        function isUpcShape(v) {
          return (
            typeof v === "string" &&
            /^\d+$/.test(v) &&
            [6, 8, 12, 13].includes(v.length)
          );
        }

        function startZxing() {
          statusEl.textContent = "Loading scanner\u2026";
          loadZxing(
            () => {
              try {
                const hints = new Map();
                hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS, [
                  ZXingBrowser.BarcodeFormat.UPC_A,
                  ZXingBrowser.BarcodeFormat.UPC_E,
                ]);
                hints.set(ZXingBrowser.DecodeHintType.TRY_HARDER, true);
                zxingReader = new ZXingBrowser.BrowserMultiFormatReader(hints);
                statusEl.textContent = "Point at a UPC barcode";
                zxingReader.decodeFromStream(stream, video, (res) => {
                  if (!running || !res) return;
                  const fmt = res.getBarcodeFormat();
                  const label =
                    fmt === ZXingBrowser.BarcodeFormat.UPC_A
                      ? "upc_a"
                      : fmt === ZXingBrowser.BarcodeFormat.UPC_E
                        ? "upc_e"
                        : null;
                  if (label) considerReading(res.getText(), label);
                });
              } catch (e) {
                cameraFail(
                  "Scanner failed to initialize. Reload the page and try again.",
                );
              }
            },
            () => {
              cameraFail(
                "Couldn\u2019t load the scanning engine (offline?). Your browser also lacks the native scanner. Use SKU entry instead.",
              );
            },
          );
        }

        // --- Optional camera helpers (flip button only; never in the scan path) ---
        async function refreshDeviceList() {
          const all = await navigator.mediaDevices.enumerateDevices();
          videoDevices = all.filter((d) => d.kind === "videoinput");
        }
        function currentDeviceId() {
          const t =
            stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
          if (t && t.getSettings) {
            const s = t.getSettings();
            if (s && s.deviceId) return s.deviceId;
          }
          return chosenDeviceId;
        }
        function showCamLabel() {
          if (!camLabelEl) return;
          const t =
            stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
          const activeId = currentDeviceId();
          const dev = videoDevices.find((d) => d.deviceId === activeId);
          let label = (t && t.label) || (dev && dev.label) || "";
          if (!label) {
            const i = videoDevices.findIndex((d) => d.deviceId === activeId);
            label = "camera " + (i < 0 ? "?" : i);
          }
          label = label.replace(/\s*\([0-9a-f:]+\)\s*$/i, "").trim();
          camLabelEl.textContent = label;
          camLabelEl.classList.add("show");
          clearTimeout(showCamLabel._t);
          showCamLabel._t = setTimeout(
            () => camLabelEl.classList.remove("show"),
            2600,
          );
        }

        // Loads ZXing UMD and normalizes it to a stable global: window.ZXingBrowser
        let zxingLoading = false;
        function loadZxing(onReady, onError) {
          if (window.ZXingBrowser) return onReady();
          if (window.ZXing) {
            window.ZXingBrowser = window.ZXing;
            return onReady();
          }
          if (zxingLoading) return;
          zxingLoading = true;
          const s = document.createElement("script");
          s.src =
            "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
          s.onload = () => {
            window.ZXingBrowser = window.ZXingBrowser || window.ZXing;
            if (
              window.ZXingBrowser &&
              window.ZXingBrowser.BrowserMultiFormatReader
            )
              onReady();
            else onError();
          };
          s.onerror = onError;
          document.head.appendChild(s);
        }

        /* --- Light stability check ---
     The native detector is reliable, so we don't second-guess its values with
     checksums (which risk rejecting valid reads, especially UPC-E variants).
     We only require the SAME value on 2 consecutive frames as cheap insurance
     against a rare single-frame glitch. Set REQUIRED_HITS to 1 for instant reads. */
        const REQUIRED_HITS = 2;
        let lastCandidate = null;
        let candidateCount = 0;

        // Returns true when a reading is confirmed and accepted.
        function considerReading(value, format) {
          if (!running) return false;
          if (!value || !/^\d+$/.test(value)) return false; // digits only, no other filtering
          if (value === lastCandidate) {
            candidateCount++;
          } else {
            lastCandidate = value;
            candidateCount = 1;
          }
          if (candidateCount >= REQUIRED_HITS) {
            onDecoded(value);
            return true;
          }
          return false;
        }

        function onDecoded(value) {
          if (!running) return;
          reticle.classList.add("locked");
          stopScanner();
          if (navigator.vibrate) navigator.vibrate(60);
          showResult("Scanned UPC", value);
        }

        function stopScanner() {
          running = false;
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          if (zxingReader) {
            try {
              zxingReader.reset();
            } catch (_) {}
            zxingReader = null;
          }
          if (stream) {
            stream.getTracks().forEach((t) => t.stop());
            stream = null;
          }
          video.srcObject = null;
        }

        // Manual camera switch: move to the next physical camera by deviceId.
        document
          .getElementById("flipCam")
          .addEventListener("click", async () => {
            try {
              await refreshDeviceList();
            } catch (_) {}
            if (videoDevices.length < 2) {
              statusEl.textContent = "Only one camera available";
              setTimeout(() => {
                if (running) statusEl.textContent = "Point at a UPC barcode";
              }, 1500);
              return;
            }
            // Find where we currently are and advance to the next device.
            const activeId = currentDeviceId();
            let idx = videoDevices.findIndex((d) => d.deviceId === activeId);
            if (idx < 0) idx = 0;
            const next = videoDevices[(idx + 1) % videoDevices.length];
            chosenDeviceId = next.deviceId;
            statusEl.textContent = "Switching camera\u2026";
            stopScanner();
            setTimeout(startScanner, 200);
          });

        function cameraFail(message) {
          stopScanner();
          const stage = document.getElementById("stage");
          stage.innerHTML =
            '<div class="camfail"><p>' +
            message +
            "</p>" +
            '<button class="again" id="failBack" style="background:#fff;color:#000;border-color:#fff;">Go back</button></div>';
          document
            .getElementById("failBack")
            .addEventListener("click", () => location.reload());
        }

        /* ---------------- Native keyboard inputs ---------------- */
        const MIN_DIGITS = 5,
          MAX_DIGITS = 12;
        const displayEl = document.getElementById("skuDisplay");
        const noteEl = document.getElementById("skuNote");
        const enterKey = document.getElementById("enterKey");
        const searchDisplay = document.getElementById("searchDisplay");
        const searchForm = document.getElementById("searchForm");

        // SKU uses the device's native numeric/phone-style keyboard.
        displayEl.addEventListener("input", () => {
          // Keep only digits and enforce the existing 5–12 digit rule.
          const cleaned = displayEl.value
            .replace(/\D/g, "")
            .slice(0, MAX_DIGITS);
          if (displayEl.value !== cleaned) displayEl.value = cleaned;
          refresh();
        });

        displayEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            submitSku();
          }
        });

        function fitFont() {
          const max = 40,
            min = 16;
          displayEl.style.setProperty("--sku-fs", max + "px");
          const cs = getComputedStyle(displayEl);
          let size = max;
          while (size > min && displayEl.scrollWidth > displayEl.clientWidth) {
            size -= 2;
            displayEl.style.setProperty("--sku-fs", size + "px");
          }
        }

        function refresh() {
          const v = displayEl.value;
          const valid = v.length >= MIN_DIGITS && v.length <= MAX_DIGITS;
          enterKey.disabled = !valid;

          if (v.length === 0) noteEl.textContent = "Enter 5 to 12 digits";
          else if (v.length < MIN_DIGITS)
            noteEl.textContent =
              MIN_DIGITS -
              v.length +
              " more digit" +
              (MIN_DIGITS - v.length === 1 ? "" : "s") +
              " needed";
          else
            noteEl.textContent = "\u2713 Ready \u2022 " + v.length + " digits";

          noteEl.className = "countnote" + (valid ? " good" : "");
          fitFont();
        }

        function resetSku() {
          displayEl.value = "";
          refresh();
        }

        function submitSku() {
          const v = displayEl.value.replace(/\D/g, "");
          if (v.length >= MIN_DIGITS && v.length <= MAX_DIGITS)
            showResult("Entered SKU", v);
        }

        enterKey.addEventListener("click", submitSku);

        document.getElementById("clearKey").addEventListener("click", () => {
          displayEl.value = "";
          refresh();
          displayEl.focus();
        });

        // Search uses a normal text input, so the OS supplies the native
        // alphanumeric keyboard on phones/tablets.
        searchForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const value = searchDisplay.value.trim();
          if (value) showResult("Search", value);
        });

        function resetSearch() {
          searchDisplay.value = "";
        }

        window.addEventListener("resize", fitFont);
        refresh();
      })();
    </script>
  </body>
</html>
